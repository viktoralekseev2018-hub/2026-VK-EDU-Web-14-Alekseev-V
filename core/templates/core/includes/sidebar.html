<aside class="col-lg-3" aria-label="Боковая колонка">
  <section class="mb-4">
    <h2 class="h4">Популярные теги</h2>
    <div class="d-flex flex-wrap gap-2">
      {% for tag in popular_tags %}
        <a class="badge text-bg-secondary text-decoration-none" href="{% url 'questions:tag' tag.name %}">{{ tag.name }} ({{ tag.count }})</a>
      {% endfor %}
    </div>
  </section>
  <section>
    <h2 class="h4">Лучшие участники</h2>
    <ul class="list-unstyled mb-0">
      {% for member in best_members %}
        <li class="mb-2">{{ member.name }} — {{ member.score }} баллов</li>
      {% endfor %}
    </ul>
  </section>
</aside>
